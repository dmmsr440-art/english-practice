<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>英語練習</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        :root {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --primary-light: #EFF6FF;
            --bg: #F1F5F9;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-2: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --shadow: 0 2px 16px rgba(0,0,0,0.07);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── SCREEN SYSTEM ── */
        .screen { display: none; min-height: 100vh; flex-direction: column; }
        .screen.active { display: flex; }

        /* ── HEADER ── */
        .header {
            background: white;
            padding: 12px 16px;
            padding-top: calc(12px + var(--safe-top));
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 1px 0 var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title { font-size: 17px; font-weight: 700; flex: 1; }
        .back-btn {
            background: var(--primary-light);
            border: none;
            color: var(--primary);
            font-size: 20px;
            width: 36px; height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .header-action {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 7px 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ── HOME ── */
        .home-hero {
            background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
            color: white;
            padding: calc(36px + var(--safe-top)) 24px 32px;
            text-align: center;
        }
        .home-hero h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
        .home-hero p { font-size: 14px; opacity: 0.8; }

        .stats-row {
            display: flex;
            gap: 1px;
            background: var(--border);
            border-bottom: 1px solid var(--border);
        }
        .stat-card {
            flex: 1;
            text-align: center;
            padding: 14px 8px;
            background: white;
        }
        .stat-number { font-size: 26px; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-2); margin-top: 2px; }

        .menu-section { padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
        .section-title { font-size: 12px; font-weight: 700; color: var(--text-2); letter-spacing: 0.05em; margin-bottom: 4px; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .menu-card {
            background: white;
            border-radius: 18px;
            padding: 22px 16px;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.12s;
            border: none;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .menu-card:active { transform: scale(0.95); }
        .menu-card .icon { font-size: 34px; }
        .menu-card .m-title { font-size: 15px; font-weight: 700; }
        .menu-card .m-desc { font-size: 11px; color: var(--text-2); line-height: 1.4; }

        .menu-card-wide {
            background: white;
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.12s;
            border: none;
            display: flex; align-items: center; gap: 16px;
        }
        .menu-card-wide:active { transform: scale(0.97); }
        .menu-card-wide .icon { font-size: 30px; }
        .menu-card-wide .text { flex: 1; text-align: left; }
        .menu-card-wide .m-title { font-size: 15px; font-weight: 700; }
        .menu-card-wide .m-desc { font-size: 12px; color: var(--text-2); margin-top: 2px; }
        .menu-card-wide .arrow { font-size: 18px; color: var(--text-2); }

        /* ── PROGRESS BAR ── */
        .progress-wrap { padding: 12px 16px 0; }
        .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.4s; }

        /* ── PRACTICE LAYOUT ── */
        .practice-body { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }

        .phrase-card {
            background: white;
            border-radius: 22px;
            padding: 24px 20px;
            box-shadow: var(--shadow);
            display: flex; flex-direction: column; gap: 14px;
            flex: 1;
        }
        .phrase-num { font-size: 12px; color: var(--text-2); font-weight: 600; text-align: right; }
        .japanese-text { font-size: 19px; font-weight: 700; line-height: 1.55; color: var(--text); }
        .english-box {
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.65;
            color: #1E3A5F;
        }
        .hint-text { font-size: 13px; color: var(--text-2); text-align: center; }
        .spacer { flex: 1; }

        /* ── PLAY BUTTON ── */
        .big-circle-btn {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.12s, box-shadow 0.12s;
            margin: 0 auto;
        }
        .big-circle-btn:active { transform: scale(0.9); }
        .play-btn-style {
            background: var(--primary);
            box-shadow: 0 6px 24px rgba(59,130,246,0.45);
        }
        .play-btn-style.playing {
            background: var(--warning);
            box-shadow: 0 6px 24px rgba(245,158,11,0.45);
        }
        .rec-btn-style {
            background: var(--error);
            box-shadow: 0 6px 24px rgba(239,68,68,0.40);
        }
        .rec-btn-style.recording { animation: pulse 1.1s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(0.92); } }

        .center-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .status-text { font-size: 13px; color: var(--text-2); text-align: center; min-height: 20px; }

        /* ── BUTTONS ── */
        .btn {
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #F1F5F9; color: var(--text); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--error); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-row { display: flex; gap: 10px; }
        .btn-row .btn { flex: 1; }

        /* ── NAV ARROWS ── */
        .nav-arrows { display: flex; gap: 14px; justify-content: center; align-items: center; }
        .nav-arrow {
            width: 52px; height: 52px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: white;
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.12s;
            color: var(--text);
        }
        .nav-arrow:active { background: var(--primary); border-color: var(--primary); color: white; }

        /* ── SCORE ── */
        .score-box { border-radius: 16px; padding: 16px 20px; text-align: center; }
        .score-box.s-great { background: #D1FAE5; color: #065F46; }
        .score-box.s-good { background: #FEF3C7; color: #92400E; }
        .score-box.s-try { background: #FEE2E2; color: #991B1B; }
        .score-num { font-size: 38px; font-weight: 900; }
        .score-msg { font-size: 14px; margin-top: 4px; font-weight: 600; }

        .result-section { display: flex; flex-direction: column; gap: 10px; }
        .result-label { font-size: 11px; font-weight: 700; color: var(--text-2); letter-spacing: 0.04em; margin-bottom: 2px; }
        .transcript-box {
            background: #F8FAFC;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            min-height: 52px;
            color: var(--text);
            line-height: 1.5;
        }

        /* ── PHRASES LIST ── */
        .search-wrap { padding: 12px 16px; background: white; border-bottom: 1px solid var(--border); }
        .search-input {
            width: 100%;
            padding: 10px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            background: var(--bg);
            outline: none;
            font-family: inherit;
        }
        .search-input:focus { border-color: var(--primary); }

        .phrases-list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

        .phrase-item {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.1s;
            border-left: 4px solid var(--primary);
        }
        .phrase-item:active { transform: scale(0.98); }
        .pi-jp { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
        .pi-en { font-size: 13px; color: #1E3A5F; margin-bottom: 6px; line-height: 1.45; }
        .pi-meta { font-size: 11px; color: var(--text-2); display: flex; gap: 12px; flex-wrap: wrap; }

        /* ── ADD FORM ── */
        .form-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 13px; font-weight: 700; color: var(--text-2); }
        .form-input, .form-textarea {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            border-radius: 13px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: white;
            transition: border-color 0.15s;
        }
        .form-input:focus, .form-textarea:focus { border-color: var(--primary); }
        .form-textarea { resize: vertical; min-height: 72px; }
        .form-required { color: var(--error); }

        /* ── SETTINGS ── */
        .settings-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .settings-card { background: white; border-radius: 16px; padding: 18px; }
        .settings-card label { display: block; font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 10px; }
        .settings-card input[type="password"],
        .settings-card input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 11px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        .settings-card input[type="password"]:focus,
        .settings-card input[type="text"]:focus { border-color: var(--primary); }
        .settings-card input[type="range"] { width: 100%; accent-color: var(--primary); }
        .settings-note { font-size: 12px; color: var(--text-2); margin-top: 8px; line-height: 1.5; }

        /* ── MODAL ── */
        .overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.5);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }
        .overlay.active { display: flex; }
        .modal {
            background: white;
            width: 100%;
            max-height: 88vh;
            border-radius: 26px 26px 0 0;
            padding: 24px 20px;
            padding-bottom: calc(24px + var(--safe-bottom));
            overflow-y: auto;
        }
        .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 22px; }
        .modal-jp { font-size: 21px; font-weight: 800; line-height: 1.4; margin-bottom: 14px; }
        .modal-en { font-size: 16px; line-height: 1.65; color: #1E3A5F; background: var(--primary-light); padding: 14px 16px; border-radius: 12px; border-left: 4px solid var(--primary); margin-bottom: 14px; }
        .modal-meta { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
        .modal-memo { font-size: 13px; background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 11px; padding: 12px 14px; line-height: 1.55; }
        .modal-play-btn {
            width: 100%;
            padding: 12px;
            border-radius: 13px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: calc(90px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: #0F172A;
            color: white;
            padding: 11px 22px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.28s;
            z-index: 300;
            white-space: nowrap;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── EMPTY STATE ── */
        .empty-state { text-align: center; padding: 60px 24px; color: var(--text-2); }
        .empty-state .icon { font-size: 52px; margin-bottom: 14px; }
        .empty-state p { font-size: 15px; }

        /* ── UTILITY ── */
        .hidden { display: none !important; }
        .divider { height: 1px; background: var(--border); margin: 4px 0; }
    </style>
</head>
<body>

<!-- ========== HOME ========== -->
<div id="screen-home" class="screen active">
    <div class="home-hero">
        <h1>🇺🇸 英語練習</h1>
        <p>瞬間英作文でネイティブ英語への近道</p>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-number" id="stat-total">0</div>
            <div class="stat-label">フレーズ数</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="stat-today">0</div>
            <div class="stat-label">今日の練習</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="stat-all">0</div>
            <div class="stat-label">累計練習</div>
        </div>
    </div>

    <div class="menu-section">
        <div class="section-title">練習モード</div>
        <button class="menu-card-wide" onclick="showScreen('screen-listen'); initListen()" style="background: linear-gradient(135deg, #3B82F6, #2563EB); color: white;">
            <span class="icon">✍️</span>
            <div class="text">
                <div class="m-title" style="color:white;">瞬間英作文</div>
                <div class="m-desc" style="color:rgba(255,255,255,0.8);">日本語を見て瞬時に英語で言う練習</div>
            </div>
            <span class="arrow" style="color:rgba(255,255,255,0.7);">›</span>
        </button>

        <div class="divider"></div>
        <div class="section-title" style="margin-top:4px;">管理</div>

        <button class="menu-card-wide" onclick="showScreen('screen-phrases')">
            <span class="icon">📚</span>
            <div class="text">
                <div class="m-title">フレーズ一覧</div>
                <div class="m-desc">全フレーズの確認・追加・削除</div>
            </div>
            <span class="arrow">›</span>
        </button>

        <button class="menu-card-wide" onclick="showScreen('screen-settings')">
            <span class="icon">⚙️</span>
            <div class="text">
                <div class="m-title">設定</div>
                <div class="m-desc">APIキー・読み上げ速度</div>
            </div>
            <span class="arrow">›</span>
        </button>
    </div>
</div>

<!-- ========== 瞬間英作文 ========== -->
<div id="screen-listen" class="screen">
    <div class="header">
        <button class="back-btn" onclick="goHome()">‹</button>
        <span class="header-title">✍️ 瞬間英作文</span>
        <button class="header-action" onclick="shuffleListen()">🔀</button>
    </div>

    <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="l-progress"></div></div>
    </div>

    <div class="practice-body">
        <div class="phrase-card">
            <div class="phrase-num" id="l-num">1 / 34</div>
            <div class="hint-text">日本語を見て、英語で言えるか試してから答えを見よう</div>
            <div class="japanese-text" id="l-japanese"></div>
            <div id="l-english-wrap" class="hidden">
                <div class="english-box" id="l-english"></div>
                <div id="l-pronunciation-wrap" class="hidden" style="margin-top:10px; background:#F0FDF4; border-left:4px solid #10B981; border-radius:12px; padding:12px 14px;">
                    <div style="font-size:11px; font-weight:700; color:#065F46; margin-bottom:6px;">🎯 発音のポイント</div>
                    <div id="l-pronunciation" style="font-size:13px; color:#065F46; line-height:1.7;"></div>
                </div>
            </div>
            <div class="spacer"></div>
        </div>

        <div class="center-col">
            <button class="big-circle-btn play-btn-style" id="l-play-btn" onclick="playListen()">▶</button>
            <p class="status-text" id="l-play-status">タップして再生</p>
        </div>

        <button class="btn btn-secondary" id="l-answer-btn" onclick="toggleListenAnswer()">答えを見る</button>

        <div class="nav-arrows">
            <button class="nav-arrow" onclick="listenNav(-1)">‹</button>
            <button class="nav-arrow" onclick="listenNav(1)">›</button>
        </div>
    </div>
</div>

<!-- ========== PHRASES LIST ========== -->
<div id="screen-phrases" class="screen">
    <div class="header">
        <button class="back-btn" onclick="goHome()">‹</button>
        <span class="header-title">📚 フレーズ一覧</span>
        <button class="header-action" onclick="showScreen('screen-add')">＋ 追加</button>
    </div>
    <div class="search-wrap">
        <input type="text" class="search-input" placeholder="🔍 日本語・英語で検索..." id="search-input" oninput="filterPhrases()">
    </div>
    <div class="phrases-list" id="phrases-list"></div>
</div>

<!-- ========== ADD PHRASE ========== -->
<div id="screen-add" class="screen">
    <div class="header">
        <button class="back-btn" onclick="showScreen('screen-phrases')">‹</button>
        <span class="header-title">➕ フレーズ追加</span>
    </div>
    <div class="form-body">
        <div class="form-group">
            <label class="form-label">日本語 <span class="form-required">*</span></label>
            <textarea class="form-textarea" id="add-jp" placeholder="例：急かそうとしているのではありません"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">英語 <span class="form-required">*</span></label>
            <textarea class="form-textarea" id="add-en" placeholder="例：I'm not trying to rush you."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">メモ（シチュエーション・使い方のヒント）</label>
            <textarea class="form-textarea" id="add-memo" placeholder="例：会議中、相手に返答を急かしたくないときに使う表現" style="min-height:60px;"></textarea>
        </div>
        <button class="btn btn-primary" style="padding:16px;" onclick="addPhrase()">✅ 保存する</button>
    </div>
</div>

<!-- ========== SETTINGS ========== -->
<div id="screen-settings" class="screen">
    <div class="header">
        <button class="back-btn" onclick="goHome()">‹</button>
        <span class="header-title">⚙️ 設定</span>
    </div>
    <div class="settings-body">
        <div class="settings-card">
            <label>OpenAI APIキー（音声読み上げに使用）</label>
            <input type="password" id="cfg-apikey" placeholder="sk-..." />
            <button class="btn btn-primary" style="margin-top:10px;padding:11px;" onclick="saveApiKey()">保存</button>
            <p class="settings-note">キーはこの端末内だけに保存されます。</p>
        </div>
        <div class="settings-card">
            <label>読み上げ速度</label>
            <input type="range" id="cfg-rate" min="0.5" max="1.5" step="0.1" value="0.9" oninput="updateRate(this.value)">
            <p class="settings-note" id="rate-label">現在: 0.9x（遅め推奨 → 慣れたら速くしよう）</p>
        </div>
        <div class="settings-card">
            <label>データをリセット</label>
            <p class="settings-note" style="margin-bottom:10px;">自分で追加したフレーズを含む全データを初期状態に戻します。</p>
            <button class="btn btn-danger" style="padding:11px;" onclick="resetAllData()">リセット</button>
        </div>
    </div>
</div>

<!-- ========== DETAIL MODAL ========== -->
<div class="overlay" id="detail-overlay" onclick="maybeCloseModal(event)">
    <div class="modal" id="detail-modal">
        <div class="modal-handle"></div>
        <div class="modal-jp" id="d-jp"></div>
        <button class="modal-play-btn" onclick="playModalPhrase()">🔊 発音を聞く</button>
        <div class="modal-en" id="d-en"></div>
        <div class="modal-meta" id="d-meta"></div>
        <div id="d-memo-wrap"><div class="modal-memo" id="d-memo"></div></div>
        <div class="btn-row" style="margin-top:18px;">

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let phrases = [];
let cfg = { apiKey: '', rate: 0.9 };
let listenOrder = [], listenIdx = 0;
let speakOrder  = [], speakIdx  = 0;
let todayCount = 0, totalCount = 0;
let activeDetailId = null;
let recState = 'idle'; // idle | recording | processing
let mediaRec = null, audioChunks = [], webSpeechRec = null;

// ═══════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════
function boot() {
    const sc = localStorage.getItem('eng_cfg');
    if (sc) cfg = JSON.parse(sc);

    const sp = localStorage.getItem('eng_phrases');
    phrases = sp ? JSON.parse(sp) : SEED.map(p => ({...p, cnt:0, last:null}));
    if (!sp) save();

    const today = new Date().toDateString();
    const ss = localStorage.getItem('eng_stats');
    const stats = ss ? JSON.parse(ss) : {};
    todayCount = stats.date === today ? (stats.today || 0) : 0;
    totalCount = stats.total || 0;

    document.getElementById('cfg-apikey').value = cfg.apiKey || '';
    document.getElementById('cfg-rate').value = cfg.rate;
    document.getElementById('rate-label').textContent = `現在: ${cfg.rate}x（遅め推奨 → 慣れたら速くしよう）`;

    // iOS voice preload
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = ()=>{};
    speechSynthesis.getVoices();

    updateHomeStats();
}

function save() { localStorage.setItem('eng_phrases', JSON.stringify(phrases)); }
function saveCfg() { localStorage.setItem('eng_cfg', JSON.stringify(cfg)); }
function saveStats() {
    localStorage.setItem('eng_stats', JSON.stringify({
        date: new Date().toDateString(), today: todayCount, total: totalCount
    }));
}
function bumpStats() {
    todayCount++; totalCount++;
    saveStats();
    updateHomeStats();
}
function updateHomeStats() {
    document.getElementById('stat-total').textContent = phrases.length;
    document.getElementById('stat-today').textContent = todayCount;
    document.getElementById('stat-all').textContent   = totalCount;
}

// ═══════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════
function showScreen(id) {
    stopSpeech(); stopRec();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'screen-phrases') renderList();
    if (id === 'screen-home') updateHomeStats();
}
function goHome() { showScreen('screen-home'); }

// ═══════════════════════════════════════
//  LISTENING
// ═══════════════════════════════════════
function initListen() {
    listenOrder = shuffle([...Array(phrases.length).keys()]);
    listenIdx = 0;
    drawListenCard();
}
function shuffleListen() { initListen(); toast('シャッフルしました 🔀'); }

function drawListenCard() {
    if (!phrases.length) return;
    const p = phrases[listenOrder[listenIdx]];
    document.getElementById('l-japanese').textContent = p.jp;
    document.getElementById('l-english').textContent  = p.en;
    document.getElementById('l-english-wrap').classList.add('hidden');
    document.getElementById('l-answer-btn').textContent = '答えを見る';
    document.getElementById('l-num').textContent = `${listenIdx+1} / ${phrases.length}`;
    document.getElementById('l-progress').style.width = `${(listenIdx+1)/phrases.length*100}%`;
    document.getElementById('l-play-status').textContent = 'タップして再生';
    document.getElementById('l-play-btn').classList.remove('playing');
    document.getElementById('l-play-btn').textContent = '▶';
    // 発音ポイント
    const pronWrap = document.getElementById('l-pronunciation-wrap');
    const pronEl   = document.getElementById('l-pronunciation');
    if (p.pronunciation) {
        pronEl.innerHTML = p.pronunciation;
        pronWrap.classList.remove('hidden');
    } else {
        pronWrap.classList.add('hidden');
    }
    stopSpeech();
}
function listenNav(d) {
    stopSpeech();
    listenIdx = (listenIdx + d + phrases.length) % phrases.length;
    drawListenCard();
}
function toggleListenAnswer() {
    const wrap = document.getElementById('l-english-wrap');
    const btn  = document.getElementById('l-answer-btn');
    if (wrap.classList.contains('hidden')) {
        wrap.classList.remove('hidden');
        btn.textContent = '答えを隠す';
        bumpStats();
    } else {
        wrap.classList.add('hidden');
        btn.textContent = '答えを見る';
    }
}
function playListen() {
    const p = phrases[listenOrder[listenIdx]];
    speakText(p.en, document.getElementById('l-play-btn'), document.getElementById('l-play-status'));
}

// ═══════════════════════════════════════
//  TTS
// ═══════════════════════════════════════
function speakText(text, btnEl, statusEl) {
    stopSpeech();
    const clean = text.replace(/\(.*?\)/g, '').trim();
    const utt = new SpeechSynthesisUtterance(clean);
    utt.lang  = 'en-US';
    utt.rate  = cfg.rate;
    utt.pitch = 1.0;

    const voices = speechSynthesis.getVoices();
    const v = voices.find(v => v.lang==='en-US' && /Samantha|Karen|Moira/.test(v.name))
           || voices.find(v => v.lang==='en-US')
           || voices.find(v => v.lang.startsWith('en'));
    if (v) utt.voice = v;

    if (btnEl) { btnEl.textContent='⏸'; btnEl.classList.add('playing'); }
    if (statusEl) statusEl.textContent = '再生中...';

    utt.onend = utt.onerror = () => {
        if (btnEl) { btnEl.textContent='▶'; btnEl.classList.remove('playing'); }
        if (statusEl) statusEl.textContent = 'もう一度タップで再生';
    };
    speechSynthesis.speak(utt);
}
function stopSpeech() { if (speechSynthesis.speaking) speechSynthesis.cancel(); }

// ═══════════════════════════════════════
//  SPEAKING
// ═══════════════════════════════════════
function initSpeak() {
    speakOrder = shuffle([...Array(phrases.length).keys()]);
    speakIdx = 0;
    drawSpeakCard();
}
function shuffleSpeak() { initSpeak(); toast('シャッフルしました 🔀'); }

function drawSpeakCard() {
    if (!phrases.length) return;
    const p = phrases[speakOrder[speakIdx]];
    document.getElementById('s-japanese').textContent = p.jp;
    document.getElementById('s-english').textContent  = p.en;
    document.getElementById('s-result').classList.add('hidden');
    document.getElementById('s-result-btns').classList.add('hidden');
    document.getElementById('s-nav').classList.remove('hidden');
    document.getElementById('s-record-area').classList.remove('hidden');
    document.getElementById('s-num').textContent = `${speakIdx+1} / ${phrases.length}`;
    document.getElementById('s-progress').style.width = `${(speakIdx+1)/phrases.length*100}%`;
    document.getElementById('s-rec-status').textContent = 'タップして録音開始';
    document.getElementById('s-rec-btn').classList.remove('recording');
    recState = 'idle';
}
function speakNav(d) {
    stopRec();
    speakIdx = (speakIdx + d + phrases.length) % phrases.length;
    drawSpeakCard();
}
function resetSpeak() { drawSpeakCard(); }
function playAnswer() {
    const p = phrases[speakOrder[speakIdx]];
    speakText(p.en, null, null);
}

async function toggleRecording() {
    if (recState === 'idle') {
        startRec();
    } else if (recState === 'recording') {
        stopRec();
    }
}

function startRec() {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        startWebSpeech();
    } else if (cfg.apiKey) {
        startMediaRec();
    } else {
        // Fallback: manual text entry
        const txt = prompt('英語で回答を入力してください:');
        if (txt) showResult(txt);
    }
}

function startWebSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    webSpeechRec = new SR();
    webSpeechRec.lang = 'en-US';
    webSpeechRec.continuous = false;
    webSpeechRec.interimResults = true;

    webSpeechRec.onstart = () => {
        recState = 'recording';
        document.getElementById('s-rec-btn').classList.add('recording');
        document.getElementById('s-rec-status').textContent = '🔴 話してください...';
    };
    webSpeechRec.onresult = e => {
        let t = '';
        for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
        document.getElementById('s-transcript').textContent = t;
        if (e.results[e.results.length-1].isFinal) showResult(t);
    };
    webSpeechRec.onerror = e => {
        recState = 'idle';
        document.getElementById('s-rec-btn').classList.remove('recording');
        const msgs = {
            'not-allowed': 'マイクの許可が必要です',
            'no-speech': '音声が検出されませんでした',
            'network': 'ネットワークエラー'
        };
        document.getElementById('s-rec-status').textContent = msgs[e.error] || 'エラー: '+e.error;
    };
    webSpeechRec.onend = () => {
        recState = 'idle';
        document.getElementById('s-rec-btn').classList.remove('recording');
    };
    webSpeechRec.start();
}

async function startMediaRec() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRec = new MediaRecorder(stream);
        mediaRec.ondataavailable = e => audioChunks.push(e.data);
        mediaRec.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            recState = 'processing';
            document.getElementById('s-rec-status').textContent = '音声を解析中...';
            await whisper(new Blob(audioChunks, {type:'audio/mp4'}));
        };
        mediaRec.start();
        recState = 'recording';
        document.getElementById('s-rec-btn').classList.add('recording');
        document.getElementById('s-rec-status').textContent = '🔴 録音中... もう一度タップで停止';
    } catch(e) {
        document.getElementById('s-rec-status').textContent = 'マイクの許可が必要です';
    }
}

function stopRec() {
    if (webSpeechRec) { try { webSpeechRec.stop(); } catch(e){} webSpeechRec = null; }
    if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
    recState = 'idle';
    const recBtn = document.getElementById('s-rec-btn');
    if (recBtn) recBtn.classList.remove('recording');
}

async function whisper(blob) {
    try {
        const fd = new FormData();
        fd.append('file', blob, 'rec.mp4');
        fd.append('model', 'whisper-1');
        fd.append('language', 'en');
        const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${cfg.apiKey}` },
            body: fd
        });
        if (!res.ok) throw new Error('API ' + res.status);
        const data = await res.json();
        showResult(data.text);
    } catch(e) {
        recState = 'idle';
        document.getElementById('s-rec-status').textContent = 'エラー: ' + e.message;
    }
}

function showResult(transcript) {
    recState = 'idle';
    document.getElementById('s-rec-btn').classList.remove('recording');

    const p = phrases[speakOrder[speakIdx]];
    const score = calcScore(transcript, p.en);

    document.getElementById('s-transcript').textContent = transcript;

    const box = document.getElementById('s-score-box');
    const num = document.getElementById('s-score-num');
    const msg = document.getElementById('s-score-msg');
    box.className = 'score-box ' + (score>=80 ? 's-great' : score>=50 ? 's-good' : 's-try');
    num.textContent = (score>=80 ? '🎉' : score>=50 ? '👍' : '💪') + ' ' + score + '%';
    msg.textContent = score>=80 ? '素晴らしい！' : score>=50 ? 'もう少し！' : '練習しよう！';

    document.getElementById('s-result').classList.remove('hidden');
    document.getElementById('s-result-btns').classList.remove('hidden');
    document.getElementById('s-nav').classList.add('hidden');
    document.getElementById('s-record-area').classList.add('hidden');

    // update practice count
    const idx = speakOrder[speakIdx];
    phrases[idx].cnt = (phrases[idx].cnt || 0) + 1;
    phrases[idx].last = new Date().toISOString();
    save();
    bumpStats();
}

function calcScore(spoken, correct) {
    const norm = t => t.replace(/\(.*?\)/g,'').toLowerCase().replace(/[^\w\s]/g,'').trim().split(/\s+/).filter(Boolean);
    const sw = norm(spoken), cw = norm(correct);
    if (!cw.length) return 100;
    const pool = [...cw];
    let hit = 0;
    for (const w of sw) {
        const i = pool.indexOf(w);
        if (i !== -1) { hit++; pool.splice(i, 1); }
    }
    return Math.min(Math.round(hit / cw.length * 100), 100);
}

// ═══════════════════════════════════════
//  PHRASES LIST
// ═══════════════════════════════════════
function renderList(q = '') {
    const el = document.getElementById('phrases-list');
    const list = q
        ? phrases.filter(p => p.jp.includes(q) || p.en.toLowerCase().includes(q.toLowerCase()) || (p.memo||'').includes(q))
        : phrases;

    if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>フレーズが見つかりません</p></div>`;
        return;
    }
    el.innerHTML = list.map(p => `
        <div class="phrase-item" onclick="openModal('${p.id}')">
            <div class="pi-jp">${esc(p.jp)}</div>
            <div class="pi-en">${esc(p.en)}</div>
            <div class="pi-meta">
                <span>📅 ${p.date}</span>
                ${p.memo ? '<span>📝 メモあり</span>' : ''}
                ${p.cnt ? `<span>🔁 ${p.cnt}回</span>` : ''}
            </div>
        </div>
    `).join('');
}
function filterPhrases() { renderList(document.getElementById('search-input').value); }

// ═══════════════════════════════════════
//  DETAIL MODAL
// ═══════════════════════════════════════
function openModal(id) {
    const p = phrases.find(x => x.id === id);
    if (!p) return;
    activeDetailId = id;
    document.getElementById('d-jp').textContent = p.jp;
    document.getElementById('d-en').textContent = p.en;
    document.getElementById('d-meta').textContent =
        `📅 登録日: ${p.date}` + (p.cnt ? `　🔁 練習: ${p.cnt}回` : '');
    const mw = document.getElementById('d-memo-wrap');
    if (p.memo) {
        document.getElementById('d-memo').textContent = '📝 ' + p.memo;
        mw.classList.remove('hidden');
    } else {
        mw.classList.add('hidden');
    }
    document.getElementById('detail-overlay').classList.add('active');
}
function closeModal() {
    document.getElementById('detail-overlay').classList.remove('active');
    activeDetailId = null;
}
function maybeCloseModal(e) {
    if (e.target === document.getElementById('detail-overlay')) closeModal();
}
function playModalPhrase() {
    const p = phrases.find(x => x.id === activeDetailId);
    if (p) speakText(p.en, null, null);
}
function deletePhrase() {
    if (!activeDetailId) return;
    if (!confirm('このフレーズを削除しますか？')) return;
    phrases = phrases.filter(p => p.id !== activeDetailId);
    save();
    closeModal();
    renderList(document.getElementById('search-input').value);
    updateHomeStats();
    toast('削除しました');
}

// ═══════════════════════════════════════
//  ADD PHRASE
// ═══════════════════════════════════════
function addPhrase() {
    const jp   = document.getElementById('add-jp').value.trim();
    const en   = document.getElementById('add-en').value.trim();
    const memo = document.getElementById('add-memo').value.trim();
    if (!jp || !en) { toast('日本語と英語は必須です'); return; }

    const today = new Date().toISOString().slice(0,10);
    phrases.unshift({ id:'u'+Date.now(), date:today, jp, en, memo, cnt:0, last:null });
    save();
    document.getElementById('add-jp').value = '';
    document.getElementById('add-en').value = '';
    document.getElementById('add-memo').value = '';
    updateHomeStats();
    toast('追加しました ✅');
    showScreen('screen-phrases');
}

// ═══════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════
function saveApiKey() {
    cfg.apiKey = document.getElementById('cfg-apikey').value.trim();
    saveCfg();
    toast('APIキーを保存しました ✅');
}
function updateRate(v) {
    cfg.rate = parseFloat(v);
    document.getElementById('rate-label').textContent = `現在: ${v}x（遅め推奨 → 慣れたら速くしよう）`;
    saveCfg();
}
function resetAllData() {
    if (!confirm('全データを初期状態に戻しますか？追加したフレーズも削除されます。')) return;
    phrases = SEED.map(p => ({...p, cnt:0, last:null}));
    save();
    todayCount = 0; totalCount = 0; saveStats();
    updateHomeStats();
    toast('リセットしました');
}

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2600);
}

// ═══════════════════════════════════════
//  START
// ═══════════════════════════════════════
boot();
</script>
